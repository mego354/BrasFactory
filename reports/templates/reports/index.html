{% extends "base.html" %}
{% block title %}التقارير{% endblock %}
{% block page_title %}التقارير{% endblock %}
{% block content %}
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
  {% for report in reports %}
  <a href="{{ report.url }}" class="card" style="text-decoration:none;text-align:center;padding:2rem 1rem;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;">{{ report.icon }}</div>
    <div style="font-weight:700;color:var(--color-text);">{{ report.title }}</div>
    <div style="font-size:0.8rem;color:var(--color-text-muted);margin-top:0.25rem;">{{ report.subtitle }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
