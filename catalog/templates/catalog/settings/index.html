{% extends "base.html" %}
{% block title %}الإعدادات{% endblock %}
{% block page_title %}الإعدادات{% endblock %}
{% block content %}
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
  <a href="{% url 'catalog:color_list' %}" class="card" style="text-decoration:none;text-align:center;padding:2rem 1rem;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;">🎨</div>
    <div style="font-weight:700;color:var(--color-text);">الألوان</div>
    <div style="font-size:0.8rem;color:var(--color-text-muted);margin-top:0.25rem;">إدارة الألوان المتاحة</div>
  </a>
  <a href="{% url 'catalog:size_list' %}" class="card" style="text-decoration:none;text-align:center;padding:2rem 1rem;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;">📏</div>
    <div style="font-weight:700;color:var(--color-text);">المقاسات</div>
    <div style="font-size:0.8rem;color:var(--color-text-muted);margin-top:0.25rem;">إدارة المقاسات المتاحة</div>
  </a>
  <a href="{% url 'catalog:stage_list' %}" class="card" style="text-decoration:none;text-align:center;padding:2rem 1rem;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;">⚙️</div>
    <div style="font-weight:700;color:var(--color-text);">مراحل الإنتاج</div>
    <div style="font-size:0.8rem;color:var(--color-text-muted);margin-top:0.25rem;">إدارة مراحل التصنيع</div>
  </a>
  <a href="/admin/" class="card" style="text-decoration:none;text-align:center;padding:2rem 1rem;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;">🔧</div>
    <div style="font-weight:700;color:var(--color-text);">لوحة الإدارة</div>
    <div style="font-size:0.8rem;color:var(--color-text-muted);margin-top:0.25rem;">Django Admin</div>
  </a>
</div>
{% endblock %}
