{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | نظام إدارة المصنع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body {
      background: linear-gradient(135deg, #1e1033 0%, #2d1a56 50%, #1e1033 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6e40c9, #d946a8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
    }
  </style>
</head>
<body>
  <div class="login-card fade-in">
    <div class="login-logo">🏭</div>
    <h1 style="text-align:center;font-size:1.4rem;font-weight:800;color:#1e1033;margin-bottom:0.25rem;">نظام إدارة المصنع</h1>
    <p style="text-align:center;font-size:0.85rem;color:#6b5ea8;margin-bottom:2rem;">سجّل دخولك للمتابعة</p>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" style="margin-bottom:1rem;">❌ {{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_username">اسم المستخدم</label>
        <input type="text" id="id_username" name="username" class="form-control"
               value="{{ username|default:'' }}" autocomplete="username" autofocus
               placeholder="أدخل اسم المستخدم">
      </div>
      <div class="form-group">
        <label class="form-label" for="id_password">كلمة المرور</label>
        <input type="password" id="id_password" name="password" class="form-control"
               autocomplete="current-password" placeholder="أدخل كلمة المرور">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:0.5rem;">
        تسجيل الدخول
      </button>
    </form>

    <div style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:#9b72ef;">
      <a href="{% url 'external:otp_request' %}" style="color:#6e40c9;text-decoration:none;">
        دخول العملاء والعمال ←
      </a>
    </div>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
