{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من الرمز | نظام المصنع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body { background: linear-gradient(135deg, #1e1033 0%, #2d1a56 50%, #1e1033 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .otp-card { background:white; border-radius:20px; padding:2.5rem; width:100%; max-width:400px; box-shadow:0 25px 60px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="otp-card fade-in">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:3rem;margin-bottom:0.5rem;">📱</div>
      <h1 style="font-size:1.3rem;font-weight:800;color:#1e1033;margin-bottom:0.25rem;">أدخل رمز التحقق</h1>
      <p style="font-size:0.85rem;color:#6b5ea8;">
        تم إرسال رمز التحقق إلى: <strong>{{ pending.phone }}</strong>
      </p>
      <p style="font-size:0.78rem;color:#9b72ef;">الرمز صالح لمدة {{ expiry_minutes }} دقائق فقط</p>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" style="margin-bottom:1rem;">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" style="text-align:center;display:block;">رمز التحقق (6 أرقام)</label>
        <input type="text" name="otp" class="form-control otp-input"
               maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
               placeholder="● ● ● ● ● ●" autofocus autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:0.75rem;">
        تحقق ✓
      </button>
    </form>

    <div style="text-align:center;">
      <a href="{% url 'external:otp_request' %}" style="font-size:0.82rem;color:#6e40c9;text-decoration:none;">← إعادة إرسال الرمز</a>
    </div>
  </div>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
