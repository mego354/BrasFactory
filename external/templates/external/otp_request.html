{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول العملاء والعمال | نظام المصنع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body { background: linear-gradient(135deg, #1e1033 0%, #2d1a56 50%, #1e1033 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .otp-card { background:white; border-radius:20px; padding:2.5rem; width:100%; max-width:420px; box-shadow:0 25px 60px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="otp-card fade-in">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#6e40c9,#d946a8);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem;">🏭</div>
      <h1 style="font-size:1.3rem;font-weight:800;color:#1e1033;margin-bottom:0.25rem;">دخول العملاء والعمال</h1>
      <p style="font-size:0.85rem;color:#6b5ea8;">أدخل رقم هاتفك لتتلقى رمز التحقق</p>
    </div>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" style="margin-bottom:1rem;">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">رقم الهاتف</label>
        <input type="tel" name="phone" class="form-control" placeholder="01xxxxxxxxx" autocomplete="tel" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">أنت:</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.75rem;border:1.5px solid var(--color-border);border-radius:8px;cursor:pointer;font-weight:600;font-size:0.9rem;">
            <input type="radio" name="entity_type" value="client" required> 👤 عميل
          </label>
          <label style="display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.75rem;border:1.5px solid var(--color-border);border-radius:8px;cursor:pointer;font-weight:600;font-size:0.9rem;">
            <input type="radio" name="entity_type" value="worker" required> 👷 عامل
          </label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
        إرسال رمز التحقق →
      </button>
    </form>

    <div style="text-align:center;margin-top:1.25rem;font-size:0.8rem;color:#9b72ef;">
      <a href="{% url 'accounts:login' %}" style="color:#6e40c9;text-decoration:none;">← دخول المشرفين</a>
    </div>
  </div>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
